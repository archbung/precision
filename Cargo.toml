[package]
name = "precision"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "raw_value"] }
unicode-casefold = "0.2.0"

[dev-dependencies]
tempfile = "3.27.0"
